name: Backend checks

on:
  push:
    branches: [main, 'feat/**', 'integrate/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.7.4'
          enable-cache: true
      - name: Install Python and media tools
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          uv python install "$PYTHON_VERSION"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version
      - name: Install locked dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv sync --frozen --python "$PYTHON_VERSION"
      - name: Run tests
        run: uv run --frozen pytest -q -ra
      - name: Run synthetic acceptance demo
        run: uv run --frozen python scripts/demo_synthetic.py artifacts/ci-synthetic
      - name: Confirm generated schemas are committed
        run: |
          uv run --frozen python -m tennis_backend.contracts.generate_schemas
          git diff --exit-code -- schemas
